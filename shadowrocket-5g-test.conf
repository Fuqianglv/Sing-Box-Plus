# Shadowrocket 5G troubleshooting profile
# Purpose: force a clean IPv4/TCP-oriented path for mobile-network testing.
# This file contains no proxy credentials. It uses Shadowrocket's current PROXY node.

[General]
# Keep DNS and routing IPv4-only during troubleshooting.
ipv6 = false
prefer-ipv6 = false

# Use plain IPv4 DNS to avoid DoH/HTTP3/QUIC variables during testing.
dns-server = 223.5.5.5,119.29.29.29
fallback-dns-server = 223.5.5.5,119.29.29.29
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = true
private-ip-answer = true

# Keep DNS requests inside Shadowrocket when apps use hard-coded DNS.
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,223.5.5.5:53,119.29.29.29:53

# For this test, prevent proxied QUIC/HTTP3 and force applications to fall back to TCP.
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

icmp-auto-reply = true
always-reject-url-rewrite = false

# Allow Shadowrocket to update this profile from the same URL.
update-url = https://raw.githubusercontent.com/Fuqianglv/Sing-Box-Plus/main/shadowrocket-5g-test.conf

[Proxy Group]
5G-TEST = select,PROXY,DIRECT,policy-select-name=PROXY

[Rule]
FINAL,5G-TEST
