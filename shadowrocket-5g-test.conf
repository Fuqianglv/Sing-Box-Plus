# Shadowrocket 5G Test
# Banking/payment/CN traffic DIRECT; everything else uses the current PROXY node.
# Preserve the original 5G troubleshooting behavior: IPv4-only DNS/routing and proxied QUIC blocking.

[General]
# Keep this troubleshooting profile IPv4-only.
ipv6 = false
prefer-ipv6 = false

# Plain IPv4 DNS only, avoiding DoH/HTTP3/QUIC variables during cellular troubleshooting.
dns-server = 223.5.5.5,119.29.29.29
fallback-dns-server = 223.5.5.5,119.29.29.29
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = true
private-ip-answer = true

# Capture common hard-coded UDP/53 DNS queries.
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,223.5.5.5:53,119.29.29.29:53

# Force proxied apps away from QUIC/HTTP3 and back to TCP.
block-quic = all-proxy
udp-policy-not-supported-behaviour = REJECT

icmp-auto-reply = true
always-reject-url-rewrite = false

# Allow Shadowrocket to update this profile from the same URL.
update-url = https://raw.githubusercontent.com/Fuqianglv/Sing-Box-Plus/main/shadowrocket-5g-test.conf

[Proxy Group]
5G-TEST = select,PROXY,DIRECT,policy-select-name=PROXY

[Rule]
# -----------------------------------------------------------------------------
# Banking / payment: explicit DIRECT rules.
# -----------------------------------------------------------------------------

# ICBC / ABC / BOC / CCB
DOMAIN-SUFFIX,icbc.com.cn,DIRECT
DOMAIN-SUFFIX,abchina.com,DIRECT
DOMAIN-SUFFIX,boc.cn,DIRECT
DOMAIN-SUFFIX,bankofchina.com,DIRECT
DOMAIN-SUFFIX,ccb.com,DIRECT

# CMB / Bank of Communications / PSBC
DOMAIN-SUFFIX,cmbchina.com,DIRECT
DOMAIN-SUFFIX,bankcomm.com,DIRECT
DOMAIN-SUFFIX,psbc.com,DIRECT

# CIB / SPDB / CMBC / CEB / CITIC / CGB / Huaxia / Ping An
DOMAIN-SUFFIX,cib.com.cn,DIRECT
DOMAIN-SUFFIX,spdb.com.cn,DIRECT
DOMAIN-SUFFIX,cmbc.com.cn,DIRECT
DOMAIN-SUFFIX,cebbank.com,DIRECT
DOMAIN-SUFFIX,ecitic.com,DIRECT
DOMAIN-SUFFIX,cgbchina.com.cn,DIRECT
DOMAIN-SUFFIX,hxb.com.cn,DIRECT
DOMAIN-SUFFIX,pingan.com,DIRECT

# Major city / internet banks
DOMAIN-SUFFIX,bankofbeijing.com.cn,DIRECT
DOMAIN-SUFFIX,bankofshanghai.com,DIRECT
DOMAIN-SUFFIX,webank.com,DIRECT
DOMAIN-SUFFIX,mybank.cn,DIRECT

# UnionPay / Cloud QuickPass
DOMAIN-SUFFIX,unionpay.com,DIRECT
DOMAIN-SUFFIX,chinaunionpay.com,DIRECT
DOMAIN-SUFFIX,cloudquickpass.com,DIRECT

# Alipay
DOMAIN-SUFFIX,alipay.com,DIRECT
DOMAIN-SUFFIX,alipayobjects.com,DIRECT
DOMAIN-SUFFIX,alipaydev.com,DIRECT

# WeChat Pay / Tenpay
DOMAIN-SUFFIX,weixin.qq.com,DIRECT
DOMAIN-SUFFIX,wechat.com,DIRECT
DOMAIN-SUFFIX,tenpay.com,DIRECT

# Keep Apple News on the selected proxy before China rules.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AppleNews/AppleNews.list,5G-TEST

# Mainland China domains and IP ranges -> DIRECT.
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaIPs/ChinaIPs.list,DIRECT
GEOIP,CN,DIRECT

# Everything else -> current proxy node.
FINAL,5G-TEST
